# Screen autorotate configuration for ASUS ProArt PX13
# Managed by screen-autorotatectl (on/off) and manual edits.

[autorotate]
# Master switch read at service start. Use `screen-autorotatectl on|off` to toggle.
enabled = true

# Internal panel connector on ProArt PX13 (2880x1800 OLED).
internal_connector = eDP-1

# Only run on matching hardware (see /sys/class/dmi/id/product_name).
product_match = ProArt PX13
require_product = true

# false = temporary rotation (recommended; avoids fighting user monitor layouts)
# true  = write persistent layout via Mutter
apply_persistent = false

# Ignore brief/noisy orientation transitions from the accelerometer.
debounce_ms = 400

# iio-sensor-proxy orientation -> Mutter transform
# 0=normal, 1=90° clockwise, 2=180°, 3=270° clockwise
orientation_map = normal:0,bottom-up:2,right-up:1,left-up:3
